[package]
name = "ensis-sftp-service"
description = "ensis-ops SFTP 能力服务（Layer 1；仅 SFTP 子系统，不申请 shell）"
version = "2.0.3"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "ensis-sftp-service"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
ensis-logutil = { path = "../../packages/rust/ensis-logutil" }
ensis-netproxy = { path = "../../packages/rust/ensis-netproxy" }
ensis-serviceipc = { path = "../../packages/rust/ensis-serviceipc" }
ensis-tunnel = { path = "../../packages/rust/ensis-tunnel" }
russh = "0.44"
russh-keys = "0.44"
russh-sftp = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssh-key = "0.6"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
