[package]
name = "ensis-redis-service"
description = "ensis-ops Redis 能力服务（Layer 1）"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "ensis-redis-service"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
futures-util = "0.3"
ensis-logutil = { path = "../../packages/rust/ensis-logutil" }
ensis-netproxy = { path = "../../packages/rust/ensis-netproxy" }
ensis-serviceipc = { path = "../../packages/rust/ensis-serviceipc" }
ensis-tunnel = { path = "../../packages/rust/ensis-tunnel" }
redis = { version = "1", features = ["tokio-comp", "cluster-async", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
