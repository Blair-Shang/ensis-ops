id: com.ensisops.mysql
name: MySQL Service
version: 0.1.0
bridge:
  namespace: mysql
  connection_kind: mysql
session:
  inject_credentials: true
  credential_methods:
    - session.open
    - session.test
    - tree.databases
    - tree.tables
    - tree.routines
    - tree.categoryCounts
    - meta.columns
    - meta.indexes
    - meta.ddl
    - meta.routineSource
    - meta.processlist
    - meta.kill
    - meta.instanceOverview
    - meta.locks
    - meta.serverVariables
    - meta.serverStatus
    - meta.innodbDeadlock
    - meta.primaryKey
    - meta.foreignKeys
    - meta.objectCatalog
    - catalog.schemas
    - catalog.tables
    - catalog.columns
    - ddl.designPreview
    - ddl.designApply
    - ddl.createTable
    - io.exportCsv
    - io.importCsv
    - io.dumpSql
    - io.execSqlFile
    - io.cancel
    # tools.detect / tools.cancel 只探测本机路径或取消任务，无需站点凭据
    - tools.dump
    - tools.restore
runtime:
  executable: bin/ensis-mysql-service.exe
  executable_windows: bin/ensis-mysql-service.exe
  executable_unix: bin/ensis-mysql-service
  lang: go
ipc:
  transport: named_pipe
  transport_windows: named_pipe
  transport_unix: unix_socket
  address: '\\.\pipe\ensis-ops.mysql'
  address_windows: '\\.\pipe\ensis-ops.mysql'
  address_unix: '/tmp/ensis-ops.mysql.sock'
  protocol: length_prefixed_json
lifecycle:
  startup: lazy
permissions: []
