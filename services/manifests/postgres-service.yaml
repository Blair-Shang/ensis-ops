id: com.ensisops.postgres
name: PostgreSQL Service
version: 0.1.0
bridge:
  namespace: postgres
  connection_kind: postgres
session:
  inject_credentials: true
  credential_methods:
    - session.open
    - session.test
    - lsp.open
    - lsp.rpc
    - lsp.close
    - tree.databases
    - tree.schemas
    - tree.tables
    - tree.routines
    - tree.sequences
    - tree.triggers
    - tree.categoryCounts
    - catalog.schemas
    - catalog.tables
    - catalog.columns
    - meta.columns
    - meta.indexes
    - meta.constraints
    - meta.ddl
    - meta.routineSource
    - meta.primaryKey
    - meta.foreignKeys
    - meta.databaseCreateOptions
    - meta.databaseOverview
    - meta.instanceOverview
    - meta.activity
    - meta.locks
    - meta.backendCancel
    - meta.backendTerminate
    - meta.serverVariables
    - meta.serverStatus
    - meta.privileges
    - ddl.script
    - ddl.exec
    - ddl.designPreview
    - ddl.designApply
    - ddl.createTablePreview
    - ddl.createTableApply
    - io.exportCsv
    - io.importCsv
    - io.dumpSql
    - io.execSqlFile
    - io.cancel
runtime:
  executable: bin/ensis-postgres-service.exe
  executable_windows: bin/ensis-postgres-service.exe
  executable_unix: bin/ensis-postgres-service
  lang: go
ipc:
  transport: named_pipe
  transport_windows: named_pipe
  transport_unix: unix_socket
  address: '\\.\pipe\ensis-ops.postgres'
  address_windows: '\\.\pipe\ensis-ops.postgres'
  address_unix: '/tmp/ensis-ops.postgres.sock'
  protocol: length_prefixed_json
lifecycle:
  startup: lazy
permissions: []
