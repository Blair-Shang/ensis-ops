id: com.ensisops.sftp
name: SFTP Service
version: 0.1.0
bridge:
  namespace: sftp
  connection_kind: sftp
session:
  inject_credentials: true
  credential_methods:
    - session.open
    - session.test
runtime:
  executable: bin/ensis-sftp-service.exe
  executable_windows: bin/ensis-sftp-service.exe
  executable_unix: bin/ensis-sftp-service
  lang: rust
ipc:
  transport: named_pipe
  transport_windows: named_pipe
  transport_unix: unix_socket
  address: '\\.\pipe\ensis-ops.sftp'
  address_windows: '\\.\pipe\ensis-ops.sftp'
  address_unix: '/tmp/ensis-ops.sftp.sock'
  protocol: length_prefixed_json
lifecycle:
  startup: lazy
permissions: []
