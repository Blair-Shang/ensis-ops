id: com.ensisops.kingbase
name: Kingbase Service
version: 0.1.0
bridge:
  namespace: kingbase
  connection_kind: kingbase
session:
  inject_credentials: true
  credential_methods:
    - session.open
    - session.test
    - tree.databases
    - tree.schemas
    - tree.tables
    - tree.routines
    - tree.sequences
    - tree.categoryCounts
    - catalog.schemas
    - catalog.tables
    - catalog.columns
    - meta.columns
    - meta.indexes
    - meta.constraints
    - meta.ddl
    - meta.routineSource
    - meta.primaryKey
    - meta.foreignKeys
    - meta.databaseCreateOptions
    - meta.instanceOverview
    - meta.activity
    - meta.locks
    - meta.backendCancel
    - meta.backendTerminate
    - meta.serverVariables
    - meta.serverStatus
    - ddl.script
    - ddl.exec
    - ddl.designPreview
    - ddl.designApply
    - ddl.createTablePreview
    - ddl.createTableApply
    - io.exportCsv
    - io.importCsv
    - io.dumpSql
    - io.execSqlFile
    - io.cancel
runtime:
  executable: bin/ensis-kingbase-service.exe
  executable_windows: bin/ensis-kingbase-service.exe
  executable_unix: bin/ensis-kingbase-service
  lang: go
ipc:
  transport: named_pipe
  transport_windows: named_pipe
  transport_unix: unix_socket
  address: '\\.\pipe\ensis-ops.kingbase'
  address_windows: '\\.\pipe\ensis-ops.kingbase'
  address_unix: '/tmp/ensis-ops.kingbase.sock'
  protocol: length_prefixed_json
lifecycle:
  startup: lazy
permissions: []
