id: com.ensisops.redis
name: Redis Service
version: 0.1.0
bridge:
  namespace: redis
  connection_kind: redis
session:
  inject_credentials: true
  credential_methods:
    - session.open
    - session.test
    - tree.databases
runtime:
  executable: bin/ensis-redis-service.exe
  executable_windows: bin/ensis-redis-service.exe
  executable_unix: bin/ensis-redis-service
  lang: rust
ipc:
  transport: named_pipe
  transport_windows: named_pipe
  transport_unix: unix_socket
  address: '\\.\pipe\ensis-ops.redis'
  address_windows: '\\.\pipe\ensis-ops.redis'
  address_unix: '/tmp/ensis-ops.redis.sock'
  protocol: length_prefixed_json
lifecycle:
  startup: lazy
permissions: []
