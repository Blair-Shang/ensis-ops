id: com.ensisops.sqlserver
name: SQL Server Service
version: 0.1.0
bridge:
  namespace: sqlserver
  connection_kind: sqlserver
session:
  inject_credentials: true
  credential_methods:
    - session.open
    - session.test
    - lsp.open
    - lsp.rpc
    - lsp.close
    - tree.databases
    - tree.schemas
    - tree.tables
    - tree.routines
    - tree.sequences
    - tree.categoryCounts
    - meta.columns
    - meta.indexes
    - meta.primaryKey
    - meta.ddl
    - meta.routineSource
    - meta.foreignKeys
    - meta.checks
    - catalog.schemas
    - catalog.tables
    - catalog.columns
    - ddl.designPreview
    - ddl.designApply
    - ddl.createTable
    - ddl.createTablePreview
    - io.exportCsv
    - io.importCsv
    - io.dumpSql
    - io.execSqlFile
    - io.cancel
runtime:
  executable: bin/ensis-sqlserver-service.exe
  executable_windows: bin/ensis-sqlserver-service.exe
  executable_unix: bin/ensis-sqlserver-service
  lang: go
ipc:
  transport: named_pipe
  transport_windows: named_pipe
  transport_unix: unix_socket
  address: '\\.\pipe\ensis-ops.sqlserver'
  address_windows: '\\.\pipe\ensis-ops.sqlserver'
  address_unix: '/tmp/ensis-ops.sqlserver.sock'
  protocol: length_prefixed_json
lifecycle:
  startup: lazy
permissions: []
